<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Calc - Opus AI</title>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-blue: #3B82F6;
            --secondary-purple: #8B5CF6;
            --accent-pink: #EC4899;
            --success-green: #10B981;
            --dark-glass: rgba(30, 41, 59, 0.7);
            --light-glass: rgba(248, 250, 252, 0.1);
            --gradient-1: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            --gradient-2: linear-gradient(135deg, #EC4899 0%, #3B82F6 100%);
            --gradient-3: linear-gradient(135deg, #10B981 0%, #3B82F6 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            animation: pulse 5s infinite;
        }

        body::before {
            background: var(--primary-blue);
            top: 10%;
            left: 10%;
        }

        body::after {
            background: var(--accent-pink);
            bottom: 10%;
            right: 10%;
            animation-delay: 2s;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.2); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .calc-container {
            width: 100%;
            max-width: 400px;
            background: var(--dark-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
            margin: 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            color: white;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .display {
            background: var(--light-glass);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #prev-val {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            min-height: 1.2rem;
            margin-bottom: 0.5rem;
        }

        #current-val {
            color: white;
            font-size: 2.5rem;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        button {
            aspect-ratio: 1;
            border: none;
            border-radius: 1.25rem;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-op {
            background: var(--gradient-1);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-eq {
            background: var(--gradient-3);
            grid-column: span 2;
            aspect-ratio: auto;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-ac {
            background: var(--gradient-2);
        }

        .history-panel {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 100px;
            overflow-y: auto;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
            animation: slideUp 0.3s ease-out;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .calc-container { padding: 1.5rem; }
            button { border-radius: 1rem; }
            #current-val { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="header">
            <h1><i data-lucide="calculator"></i> Calc ✨</h1>
            <div style="display: flex; gap: 10px;">
                <i data-lucide="sun" id="theme-icon"></i>
                <i data-lucide="history"></i>
            </div>
        </div>

        <div class="display">
            <div id="prev-val"></div>
            <div id="current-val">0</div>
        </div>

        <div class="grid">
            <button class="btn-ac" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()"><i data-lucide="delete"></i></button>
            <button onclick="appendOperator('%')"><i data-lucide="percent"></i></button>
            <button class="btn-op" onclick="appendOperator('/')"><i data-lucide="divide"></i></button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="appendOperator('*')"><i data-lucide="x"></i></button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="appendOperator('-')"><i data-lucide="minus"></i></button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-op" onclick="appendOperator('+')"><i data-lucide="plus"></i></button>

            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="btn-eq" onclick="calculate()">=</button>
        </div>

        <div class="history-panel" id="history-box">
            <!-- Riwayat akan muncul di sini -->
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetScreen = false;

        const currentValElem = document.getElementById('current-val');
        const prevValElem = document.getElementById('prev-val');
        const historyBox = document.getElementById('history-box');

        function updateDisplay() {
            currentValElem.innerText = currentInput;
            prevValElem.innerText = previousInput;
        }

        function appendNumber(num) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operation !== null) calculate();
            previousInput = currentInput + ' ' + op;
            operation = op;
            shouldResetScreen = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.toString().slice(0, -1);
            if (currentInput === '') currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            if (operation === null || shouldResetScreen) return;
            
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    if (current === 0) {
                        alert("Tidak bisa membagi 0!");
                        clearDisplay();
                        return;
                    }
                    result = prev / current; 
                    break;
                case '%': result = prev % current; break;
                default: return;
            }

            addToHistory(`${previousInput} ${currentInput} = ${result}`);
            currentInput = result.toString();
            operation = null;
            previousInput = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        function addToHistory(text) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>${text.split('=')[0]}</span><span>= ${text.split('=')[1]}</span>`;
            historyBox.prepend(item);
            if (historyBox.children.length > 3) historyBox.lastChild.remove();
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= 0 && e.key <= 9) appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '=' || e.key === 'Enter') calculate();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearDisplay();
            if (['+', '-', '*', '/', '%'].includes(e.key)) appendOperator(e.key);
        });

        // Dummy proxy logic reminder for developer
        // fetch('https://cors-anywhere.herokuapp.com/example.com/api');
    </script>
</body>
</html>
