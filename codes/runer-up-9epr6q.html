<!DOCTYPE html> <html lang="id"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>Cici AI Web App</title>     <!-- Axios CDN -->     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>     <style>         :root {             --bg-color: #121212;             --chat-bg: #1e1e1e;             --primary: #bb86fc;             --user-msg: #3700b3;             --ai-msg: #2c2c2c;             --text-color: #ffffff;         }          body {             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;             background-color: var(--bg-color);             color: var(--text-color);             margin: 0;             display: flex;             justify-content: center;             height: 100vh;         }          .app-container {             width: 100%;             max-width: 600px;             background-color: var(--chat-bg);             display: flex;             flex-direction: column;             box-shadow: 0 0 20px rgba(0,0,0,0.5);         }          header {             background-color: #1f1f1f;             padding: 15px;             text-align: center;             border-bottom: 1px solid #333;             display: flex;             align-items: center;             justify-content: center;             gap: 10px;         }          header h1 {             margin: 0;             font-size: 1.2rem;             color: var(--primary);         }          #chat-box {             flex: 1;             padding: 15px;             overflow-y: auto;             display: flex;             flex-direction: column;             gap: 10px;         }          .message {             max-width: 80%;             padding: 10px 15px;             border-radius: 15px;             line-height: 1.5;             word-wrap: break-word;             font-size: 0.95rem;             animation: fadeIn 0.3s ease;         }          .message.user {             align-self: flex-end;             background-color: var(--user-msg);             border-bottom-right-radius: 2px;         }          .message.ai {             align-self: flex-start;             background-color: var(--ai-msg);             border-bottom-left-radius: 2px;             white-space: pre-wrap;         }          .input-area {             padding: 15px;             background-color: #1f1f1f;             border-top: 1px solid #333;             display: flex;             gap: 10px;         }          input[type="text"] {             flex: 1;             padding: 12px;             border-radius: 25px;             border: 1px solid #444;             background-color: #2c2c2c;             color: white;             outline: none;         }          button {             background-color: var(--primary);             color: black;             border: none;             padding: 10px 20px;             border-radius: 25px;             cursor: pointer;             font-weight: bold;             transition: opacity 0.2s;         }          button:hover {             opacity: 0.8;         }          button:disabled {             background-color: #555;             cursor: not-allowed;         }          .loading {             font-size: 0.8rem;             color: #888;             margin-left: 10px;             display: none;         }          @keyframes fadeIn {             from { opacity: 0; transform: translateY(10px); }             to { opacity: 1; transform: translateY(0); }         }          /* Scrollbar styling */         ::-webkit-scrollbar { width: 6px; }         ::-webkit-scrollbar-track { background: #1e1e1e; }         ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }     </style> </head> <body>  <div class="app-container">     <header>         <h1>🤖 Cici AI Interface</h1>     </header>          <div id="chat-box">         <div class="message ai">Halo! Saya Cici AI. Ada yang bisa saya bantu?</div>     </div>     <div class="loading" id="loading-indicator">Cici sedang mengetik...</div>      <div class="input-area">         <input type="text" id="user-input" placeholder="Tanya sesuatu..." autocomplete="off">         <button id="send-btn" onclick="handleSend()">Kirim</button>     </div> </div>  <script>     // --- UTILITIES (Pengganti modul Node.js) ---     // Menggunakan crypto native browser sebagai pengganti 'import { randomUUID } from "crypto"'     const randomUUID = () => {         if (typeof crypto !== 'undefined' && crypto.randomUUID) {             return crypto.randomUUID();         }         // Fallback jika browser sangat lama (jarang terjadi sekarang)         return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {             var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);             return v.toString(16);         });     };      // --- CORE LOGIC (Sesuai Permintaan) ---          async function ciciai(question) {         if (!question) throw new Error("Question is required");          // Helper functions from source         const rnd = () => Math.floor(Math.random() * 1e17);         const rndHex = () => Math.floor(Math.random() * 1e17).toString(16);         const randomStr = () => Math.random().toString(36).slice(2);          const random = rnd();         const cdid = "2" + rndHex().padStart(23, "0");         const uid = rnd();         const iid = rnd();         const device_id = rnd();          // PROXY CONFIGURATION         const proxyUrl = "https://cors-anywhere.herokuapp.com/";         const targetUrl = "https://api-normal-i18n.ciciai.com/im/sse/send/message";          try {             const { data: rawData } = await axios.post(                 proxyUrl + targetUrl,                 {                     channel: 3,                     cmd: 100,                     sequence_id: randomUUID(),                     uplink_body: {                         send_message_body: {                             ack_only: false,                             applet_payload: {},                             bot_id: "7241547611541340167",                             bot_type: 1,                             client_controller_param: {                                 answer_with_suggest: true,                                 local_language_code: "en",                                 local_nickname: "Randy yuann",                                 local_voice_id: "92"                             },                             content: JSON.stringify({                                 im_cmd: -1,                                 text: question                             }),                             content_type: 1,                             conversation_id: "485805516280081",                             conversation_type: 3,                             create_time: Math.floor(Date.now() / 1000),                             ext: {                                 create_time_ms: Date.now().toString(),                                 record_status: "1",                                 wiki: "1",                                 search_engine_type: "1",                                 media_search_type: "0",                                 answer_with_suggest: "1",                                 system_language: "en",                                 is_audio: "false",                                 voice_mix_input: "0",                                 tts: "1",                                 is_app_background: "0",                                 need_deep_think: "0",                                 need_net_search: "0",                                 send_message_scene: "keyboard"                             },                             client_fallback_param: {                                 last_section_id: "",                                 last_message_index: -1                             },                             local_message_id: rndHex(),                             sender_id: "7584067883349640200",                             status: 0,                             unique_key: rndHex()                         }                     },                     version: "1"                 },                 {                     responseType: "text",                     params: {                         flow_im_arch: "v2",                         device_platform: "android",                         os: "android",                         ssmix: "a",                         _rticket: random,                         cdid,                         channel: "googleplay",                         aid: "489823",                         app_name: "nova_ai",                         version_code: rnd(),                         version_name: randomStr(),                         manifest_version_code: rnd(),                         update_version_code: rnd(),                         resolution: `${rnd() % 1000}x${rnd() % 1000}`,                         dpi: rnd() % 1000,                         device_type: randomStr(),                         device_brand: randomStr(),                         language: "en",                         os_api: rnd() % 100,                         os_version: randomStr(),                         ac: "wifi",                         uid,                         carrier_region: "ID",                         sys_region: "US",                         tz_name: "Asia/Shanghai",                         is_new_user: "1",                         region: "US",                         lang: "en",                         pkg_type: "release_version",                         iid,                         device_id,                         flow_sdk_version: rnd(),                         "use-olympus-account": "1"                     },                     headers: {                         "Accept-Encoding": "gzip",                         "Connection": "Keep-Alive",                         "Content-Type": "application/json; encoding=utf-8",                         // Host tidak perlu diset manual di browser karena diatur oleh proxy/browser                         "passport-sdk-version": "505174",                         "req_biz_id": "Message",                         "sdk-version": "2",                         "User-Agent": "com.larus.wolf/8090004 (Linux; Android 12)",                         "x-tt-store-region": "id",                         "x-tt-store-region-src": "uid",                         "X-Tt-Token": "0329aceacb51f4b2d468e8709307dcc44604a72f48ba71143b3403209f8f98cf37f4111f4fe8bac693d57dd0580c0e13a32d8d230813a3064feaf53b9d8fd9e5ae0256d50c4b29427687873645bd92d3b842a-1.0.0"                     }                 }             );              // Parsing logic EXACTLY as provided             const parts = [];             const regex = /"origin_content"\s*:\s*"([^"]*)"/g;             let match;              while ((match = regex.exec(rawData))) {                 parts.push(match[1]);             }              const chat = parts.join("");             if (!chat) throw new Error("CICI tidak mengembalikan jawaban");              return formatCici(chat);         } catch (error) {             console.error(error);             throw error;         }     }      function formatCici(text) {         // Formatting logic EXACTLY as provided         return text             .replace(/\\n/g, "\n")             .replace(/\s+\n/g, "\n")             .replace(/\n{3,}/g, "\n\n")             .replace(/\s{2,}/g, " ")             .replace(/([.!?])\s*/g, "$1 ")             .trim();     }      // --- UI LOGIC (Pengganti Handler Bot) ---      const chatBox = document.getElementById('chat-box');     const userInput = document.getElementById('user-input');     const sendBtn = document.getElementById('send-btn');     const loadingIndicator = document.getElementById('loading-indicator');      function appendMessage(text, sender) {         const div = document.createElement('div');         div.classList.add('message', sender);         div.innerText = text;         chatBox.appendChild(div);         chatBox.scrollTop = chatBox.scrollHeight;     }      async function handleSend() {         const text = userInput.value.trim();         if (!text) return;          // UI Updates         appendMessage(text, 'user');         userInput.value = '';         userInput.disabled = true;         sendBtn.disabled = true;         loadingIndicator.style.display = 'block';          try {             const response = await ciciai(text);             appendMessage(response, 'ai');         } catch (e) {             let errorMsg = "❌ Cici lagi error, coba lagi nanti.";             if(e.response && e.response.status === 403) {                 errorMsg += "\n(Info: Buka cors-anywhere.herokuapp.com/corsdemo untuk akses sementara)";             }             appendMessage(errorMsg, 'ai');         } finally {             userInput.disabled = false;             sendBtn.disabled = false;             loadingIndicator.style.display = 'none';             userInput.focus();         }     }      // Event Listener Enter Key     userInput.addEventListener('keypress', function (e) {         if (e.key === 'Enter') {             handleSend();         }     });  </script>  </body> </html>
