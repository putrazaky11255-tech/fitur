<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Aplikasi Manajemen Tugas Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f3f4f6;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }

        .logo i {
            font-size: 40px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 15px;
            color: white;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            animation: slideRight 0.6s ease;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .add-task-form {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 20px;
            background: var(--light);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: var(--dark);
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        .filter-tab:hover {
            transform: translateY(-2px);
        }

        .tasks-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            animation: slideLeft 0.6s ease;
        }

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            animation: taskSlide 0.4s ease;
        }

        @keyframes taskSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-priority {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: #fee2e2;
            color: var(--danger);
        }

        .priority-medium {
            background: #fed7aa;
            color: var(--warning);
        }

        .priority-low {
            background: #d1fae5;
            color: var(--success);
        }

        .task-description {
            color: #6b7280;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .task-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #6b7280;
            font-size: 14px;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .task-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-complete {
            background: var(--success);
            color: white;
        }

        .btn-complete:hover {
            background: #059669;
            transform: scale(1.05);
        }

        .btn-edit {
            background: var(--primary);
            color: white;
        }

        .btn-edit:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .task-completed {
            opacity: 0.7;
            background: #f9fafb;
        }

        .task-completed .task-title {
            text-decoration: line-through;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 80px;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-links a {
            color: var(--primary);
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            transform: translateY(-3px) scale(1.2);
            color: var(--secondary);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.show {
            display: flex;
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        .notification.error {
            border-left: 4px solid var(--danger);
        }

        .notification.info {
            border-left: 4px solid var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.5s ease;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-tasks"></i>
                    <span>TaskFlow Pro</span>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="totalTasks">0</div>
                        <div class="stat-label">Total Tugas</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="completedTasks">0</div>
                        <div class="stat-label">Selesai</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="pendingTasks">0</div>
                        <div class="stat-label">Tertunda</div>
                    </div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="add-task-form">
                    <h3 style="margin-bottom: 20px; color: var(--dark);">
                        <i class="fas fa-plus-circle"></i> Tambah Tugas Baru
                    </h3>
                    <form id="taskForm">
                        <div class="form-group">
                            <label for="taskTitle">
                                <i class="fas fa-heading"></i> Judul Tugas
                            </label>
                            <input type="text" id="taskTitle" placeholder="Masukkan judul tugas..." required>
                        </div>
                        <div class="form-group">
                            <label for="taskDescription">
                                <i class="fas fa-align-left"></i> Deskripsi
                            </label>
                            <textarea id="taskDescription" rows="3" placeholder="Deskripsi tugas..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="taskCategory">
                                <i class="fas fa-folder"></i> Kategori
                            </label>
                            <select id="taskCategory">
                                <option value="personal">🏠 Personal</option>
                                <option value="work">💼 Pekerjaan</option>
                                <option value="study">📚 Belajar</option>
                                <option value="health">💪 Kesehatan</option>
                                <option value="other">📌 Lainnya</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">
                                <i class="fas fa-flag"></i> Prioritas
                            </label>
                            <select id="taskPriority">
                                <option value="low">🟢 Rendah</option>
                                <option value="medium">🟡 Sedang</option>
                                <option value="high">🔴 Tinggi</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskDeadline">
                                <i class="fas fa-calendar"></i> Deadline
                            </label>
                            <input type="datetime-local" id="taskDeadline">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Tambah Tugas
                        </button>
                    </form>
                </div>

                <div class="filter-section">
                    <h3 style="margin-bottom: 15px; color: var(--dark);">
                        <i class="fas fa-filter"></i> Filter Tugas
                    </h3>
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">
                            <i class="fas fa-list"></i> Semua
                        </button>
                        <button class="filter-tab" data-filter="pending">
                            <i class="fas fa-clock"></i> Tertunda
                        </button>
                        <button class="filter-tab" data-filter="completed">
                            <i class="fas fa-check-circle"></i> Selesai
                        </button>
                    </div>
                </div>
            </aside>

            <main class="tasks-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari tugas...">
                    <i class="fas fa-search"></i>
                </div>

                <div id="tasksList">
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>Belum ada tugas</h3>
                        <p>Tambahkan tugas pertama Anda untuk memulai!</p>
                    </div>
                </div>
            </main>
        </div>

        <footer>
            <p>&copy; 2024 TaskFlow Pro - Manajemen Tugas Digital</p>
            <div class="social-links">
                <a href="#" title="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </footer>
    </div>

    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationText">Notifikasi</span>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fas fa-edit"></i> Edit Tugas
                </h2>
                <button class="modal-close" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label for="editTitle">Judul Tugas</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">Deskripsi</label>
                    <textarea id="editDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="editCategory">Kategori</label>
                    <select id="editCategory">
                        <option value="personal">🏠 Personal</option>
                        <option value="work">💼 Pekerjaan</option>
                        <option value="study">📚 Belajar</option>
                        <option value="health">💪 Kesehatan</option>
                        <option value="other">📌 Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editPriority">Prioritas</label>
                    <select id="editPriority">
                        <option value="low">🟢 Rendah</option>
                        <option value="medium">🟡 Sedang</option>
                        <option value="high">🔴 Tinggi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editDeadline">Deadline</label>
                    <input type="datetime-local" id="editDeadline">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Simpan Perubahan
                </button>
            </form>
        </div>
    </div>

    <script>
        // Data Management
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let editingTaskId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderTasks();
            updateStats();
            checkReminders();
            setInterval(checkReminders, 60000); // Check reminders every minute
        });

        // Form Submission
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            addTask();
        });

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            saveEditedTask();
        });

        // Add Task
        function addTask() {
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const deadline = document.getElementById('taskDeadline').value;

            const task = {
                id: Date.now(),
                title,
                description,
                category,
                priority,
                deadline,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(task);
            saveTasks();
            renderTasks();
            updateStats();
            
            // Reset form
            document.getElementById('taskForm').reset();
            
            showNotification('✅ Tugas berhasil ditambahkan!', 'success');
        }

        // Render Tasks
        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredTasks = tasks.filter(task => {
                const matchesFilter = 
                    currentFilter === 'all' ||
                    (currentFilter === 'completed' && task.completed) ||
                    (currentFilter === 'pending' && !task.completed);
                
                const matchesSearch = 
                    task.title.toLowerCase().includes(searchTerm) ||
                    task.description.toLowerCase().includes(searchTerm);
                
                return matchesFilter && matchesSearch;
            });

            if (filteredTasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>Tidak ada tugas</h3>
                        <p>${currentFilter === 'all' ? 'Tambahkan tugas pertama Anda!' : 'Tidak ada tugas dalam kategori ini'}</p>
                    </div>
                `;
                return;
            }

            tasksList.innerHTML = filteredTasks.map(task => `
                <div class="task-item ${task.completed ? 'task-completed' : ''}" data-id="${task.id}">
                    <div class="task-header">
                        <div class="task-title">
                            ${getCategoryIcon(task.category)}
                            ${task.title}
                        </div>
                        <span class="task-priority priority-${task.priority}">
                            ${getPriorityLabel(task.priority)}
                        </span>
                    </div>
                    ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
                    <div class="task-meta">
                        <div class="task-meta-item">
                            <i class="fas fa-folder"></i>
                            ${getCategoryLabel(task.category)}
                        </div>
                        ${task.deadline ? `
                            <div class="task-meta-item">
                                <i class="fas fa-calendar-alt"></i>
                                ${formatDeadline(task.deadline)}
                            </div>
                        ` : ''}
                        <div class="task-meta-item">
                            <i class="fas fa-clock"></i>
                            ${formatDate(task.createdAt)}
                        </div>
                    </div>
                    <div class="task-actions">
                        ${!task.completed ? `
                            <button class="task-btn btn-complete" onclick="toggleTask(${task.id})">
                                <i class="fas fa-check"></i> Selesai
                            </button>
                        ` : `
                            <button class="task-btn btn-complete" onclick="toggleTask(${task.id})">
                                <i class="fas fa-undo"></i> Batal
                            </button>
                        `}
                        <button class="task-btn btn-edit" onclick="editTask(${task.id})">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="task-btn btn-delete" onclick="deleteTask(${task.id})">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Toggle Task Completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                updateStats();
                showNotification(task.completed ? '✅ Tugas selesai!' : '↩️ Tugas dibatalkan', 'info');
            }
        }

        // Edit Task
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                editingTaskId = id;
                document.getElementById('editTitle').value = task.title;
                document.getElementById('editDescription').value = task.description;
                document.getElementById('editCategory').value = task.category;
                document.getElementById('editPriority').value = task.priority;
                document.getElementById('editDeadline').value = task.deadline;
                document.getElementById('editModal').classList.add('show');
            }
        }

        // Save Edited Task
        function saveEditedTask() {
            const task = tasks.find(t => t.id === editingTaskId);
            if (task) {
                task.title = document.getElementById('editTitle').value;
                task.description = document.getElementById('editDescription').value;
                task.category = document.getElementById('editCategory').value;
                task.priority = document.getElementById('editPriority').value;
                task.deadline = document.getElementById('editDeadline').value;
                
                saveTasks();
                renderTasks();
                updateStats();
                closeEditModal();
                showNotification('✏️ Tugas berhasil diperbarui!', 'success');
            }
        }

        // Close Edit Modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingTaskId = null;
        }

        // Delete Task
        function deleteTask(id) {
            if (confirm('Apakah Anda yakin ingin menghapus tugas ini?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
                showNotification('🗑️ Tugas berhasil dihapus!', 'error');
            }
        }

        // Update Statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const progress = total > 0 ? (completed / total) * 100 : 0;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = pending;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Filter Tasks
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderTasks();
            });
        });

        // Search Tasks
        document.getElementById('searchInput').addEventListener('input', function() {
            renderTasks();
        });

        // Save to LocalStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            
            notification.className = `notification ${type} show`;
            notificationText.textContent = message;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Check Reminders
        function checkReminders() {
            const now = new Date();
            tasks.forEach(task => {
                if (!task.completed && task.deadline) {
                    const deadline = new Date(task.deadline);
                    const timeDiff = deadline - now;
                    const hoursDiff = timeDiff / (1000 * 60 * 60);
                    
                    if (hoursDiff > 0 && hoursDiff <= 24) {
                        showNotification(`⏰ Pengingat: Tugas "${task.title}" akan deadline dalam ${Math.round(hoursDiff)} jam!`, 'info');
                    }
                }
            });
        }

        // Helper Functions
        function getCategoryIcon(category) {
            const icons = {
                personal: '🏠',
                work: '💼',
                study: '📚',
                health: '💪',
                other: '📌'
            };
            return icons[category] || '📌';
        }

        function getCategoryLabel(category) {
            const labels = {
                personal: 'Personal',
                work: 'Pekerjaan',
                study: 'Belajar',
                health: 'Kesehatan',
                other: 'Lainnya'
            };
            return labels[category] || 'Lainnya';
        }

        function getPriorityLabel(priority) {
            const labels = {
                low: 'Rendah',
                medium: 'Sedang',
                high: 'Tinggi'
            };
            return labels[priority] || 'Sedang';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        function formatDeadline(dateString) {
            const date = new Date(dateString);
            const options = { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return date.toLocaleDateString('id-ID', options);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + N: New Task
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                document.getElementById('taskTitle').focus();
            }
            
            // Ctrl/Cmd + F: Search
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            
            // Escape: Close modal
            if (e.key === 'Escape') {
                closeEditModal();
            }
        });

        // Add sample tasks for demo
        if (tasks.length === 0) {
            const sampleTasks = [
                {
                    id: Date.now() - 10000,
                    title: 'Menyelesaikan Laporan Bulanan',
                    description: 'Membuat laporan keuangan dan operasional untuk bulan ini',
                    category: 'work',
                    priority: 'high',
                    deadline: new Date(Date.now() + 2 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16),
                    completed: false,
                    createdAt: new Date().toISOString()
                },
                {
                    id: Date.now() - 5000,
                    title: 'Olahraga Pagi',
                    description: 'Jogging 30 menit di taman kota',
                    category: 'health',
                    priority: 'medium',
                    deadline: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().slice(0, 16),
                    completed: false,
                    createdAt: new Date().toISOString()
                },
                {
                    id: Date.now(),
                    title: 'Belajar JavaScript',
                    description: 'Menyelesaikan modul 5: Async/Await',
                    category: 'study',
                    priority: 'low',
                    deadline: '',
                    completed: true,
                    createdAt: new Date().toISOString()
                }
            ];
            
            tasks = sampleTasks;
            saveTasks();
            renderTasks();
            updateStats();
        }
    </script>
</body>
</html>
